<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
  <a href="/apip.html">
    <button class="btn btn-primary m-3">Back To List</button>
  </a>

  <form class="p-4" onsubmit="onSubmit(event)">
    <span>Name</span><br>
    <input type="text" id="name" class="form-control mb-3" required>

    <span>Email</span><br>
    <input type="email" id="email" class="form-control mb-3" autocomplete="email" required>

    <span>Phone</span><br>
    <input type="text" id="phone" class="form-control mb-3" required>

    <span>Address</span><br>
    <input type="text" id="address" class="form-control mb-3" required>

    <button type="submit" class="btn btn-success">Submit</button>
  </form>
  <script>
      async function onSubmit(event){
        
     event.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const address = document.getElementById('address').value;
        
        

           const data = {
            name: name,
            email: email,
            phone: phone,
            address: address,
            description:"Data",
        };

       
         let res=   await fetch('http://didar.intelsofts.com/Laravel_React/B_POS/public/api/customers',{
                method:'POST',
                headers:{
                  'Content-Type':'application/json',
                  'Accept': 'application/json',
                },
                body:JSON.stringify(data)
            }); 
            
            
        if (!res.ok) throw new Error("API Error");
       

      }
  </script>
</body>
</html>
