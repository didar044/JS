<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Toast Notification Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    /* #toast {
      position: fixed;
      top: 30px;
      right: 30px;
      background-color: #323232;
      color: #fff;
      padding: 12px 20px;
      border-radius: 4px;
      font-size: 16px;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      display: none;
    }

    #toast.show {
      display: block;
      opacity: 1;
    } */
  </style>
</head>
<body>

  <h2>Click to show a toast</h2>
  <button onclick="showToast('This is a toast message!')">Show Toast</button>

  <div id="toast"></div>

  <script>
    function showToast(message, duration = 300) {
      const toast = document.getElementById("toast");
      toast.innerText = message;
      // toast.classList.add("show");
      // toast.style.display = "block";

      setTimeout(() => {
        // toast.classList.remove("show");
        setTimeout(() => {
           toast.style.display = "none";
        }, 500); // wait for fade-out
      }, duration);
    }
  </script>

</body>
</html>
